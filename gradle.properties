org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# Compile les klibs iOS sous Linux (vérification du code ; l'édition de liens du framework reste sur macOS)
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
# Marquage concurrent du ramasse-miettes : les pauses ne bloquent plus le fil principal (saccades au défilement)
kotlin.native.binary.gc=cms
