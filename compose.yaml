name: superhealth-friends
services:
  friend-relay:
    image: superhealth-friend-relay:2
    build: .
    restart: unless-stopped
    init: true
    user: "${PUID:-568}:${PGID:-568}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.50
    ulimits:
      nofile:
        soft: 256
        hard: 256
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      PUBLISH_KEY_FILE: /run/secrets/publish_key
      MAX_CARDS: "${MAX_CARDS:-500}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-240}"
      MAX_IN_FLIGHT: "${MAX_IN_FLIGHT:-8}"
    secrets: [publish_key]
    volumes:
      - ${DATA_PATH:-./data}:/data
    # HTTP is local only. An existing HTTPS reverse proxy must front this port.
    ports:
      - "127.0.0.1:${RELAY_PORT:-8787}:8787"
    networks: [relay]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
networks:
  relay:
    name: superhealth-relay
secrets:
  publish_key:
    file: ${PUBLISH_KEY_PATH:-./secrets/publish_key}
