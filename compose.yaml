name: superhealth-friends
services:
  friend-relay:
    image: ghcr.io/mamalama0/superhealth-server:server-homeserver
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "${PUID:-568}:${PGID:-568}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.50
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      # Optional restriction for a private custom server; leave empty for the standard service.
      PUBLISH_KEY: "${PUBLISH_KEY:-}"
      MAX_CARDS: "${MAX_CARDS:-500}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-240}"
      MAX_IN_FLIGHT: "${MAX_IN_FLIGHT:-8}"
    volumes:
      - ${DATA_PATH:-relay-data}:/data
    ports:
      - "${RELAY_BIND:-0.0.0.0}:${RELAY_PORT:-8787}:8787"
    networks: [relay]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
volumes:
  relay-data:
networks:
  relay:
    name: superhealth-relay
