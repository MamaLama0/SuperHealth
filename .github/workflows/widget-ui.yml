name: WidgetKit UI
on:
  push:
    branches: [ ios, ios-widget-validation ]
    paths:
      - 'iosApp/Widgets/**'
      - 'iosApp/Tests/**'
      - 'iosApp/WidgetTestHost/**'
      - 'iosApp/project.yml'
      - '.github/workflows/widget-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widgets:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Projet et simulateur
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Captures natives (six widgets, trois tailles, clair et sombre)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild -project iosApp/SuperHealth.xcodeproj -scheme WidgetRenderTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/widget-tests \
            -resultBundlePath build/WidgetTests.xcresult ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test
          xcrun xcresulttool export attachments --path build/WidgetTests.xcresult --output-path build/widget-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WidgetKit-UI
          path: |
            build/WidgetTests.xcresult/
            build/widget-captures/
