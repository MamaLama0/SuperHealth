name: iOS

# .ipa non signée (signée à l'installation par un outil de sideload) et .app pour le simulateur.
on:
  push:
    branches: [ ios ]
    tags: [ 'ios-v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # IA offerte : valeurs injectées depuis les secrets du dépôt (absentes du code, masquées dans l'app)
      SUPERHEALTH_AI_URL: ${{ secrets.SUPERHEALTH_AI_URL }}
      SUPERHEALTH_AI_MODEL: ${{ secrets.SUPERHEALTH_AI_MODEL }}
      SUPERHEALTH_AI_KEY: ${{ secrets.SUPERHEALTH_AI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Vérification du code commun (aperçu ordinateur)
        run: ./gradlew :shared:compileKotlinDesktop --no-configuration-cache

      - name: Build iPhone (Release, non signé)
        run: |
          xcodebuild -project iosApp/SuperHealth.xcodeproj -scheme SuperHealth -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Paquet .ipa
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/SuperHealth.app
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          # signature ad hoc avec les droits (HealthKit, groupe d'apps des widgets) : l'outil de sideload les reprend en re-signant
          codesign -f -s - --entitlements iosApp/Widgets/Widgets.entitlements Payload/SuperHealth.app/PlugIns/SuperHealthWidgets.appex
          codesign -f -s - --entitlements iosApp/SuperHealth/SuperHealth.entitlements Payload/SuperHealth.app
          codesign -d --entitlements - Payload/SuperHealth.app
          zip -qry SuperHealth.ipa Payload
          ls -lh SuperHealth.ipa

      - name: Build simulateur (Debug, Apple Silicon)
        run: |
          xcodebuild -project iosApp/SuperHealth.xcodeproj -scheme SuperHealth -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/SuperHealth-simulator.zip" SuperHealth.app

      - uses: actions/upload-artifact@v4
        with:
          name: SuperHealth-ios
          path: |
            SuperHealth.ipa
            SuperHealth-simulator.zip

      - name: SideStore + HealthKit (branche sidestore)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dernière compilation publiée par .github/workflows/sidestore.yml de la branche sidestore
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("sidestore-healthkit-"))] | sort_by(.createdAt) | last | .tagName')
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SideStore-HealthKit.ipa
          ls -lh SideStore-HealthKit.ipa

      - name: Version publiée
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          # pré-version : la « dernière version » reste l'APK Android (lue par la mise à jour intégrée)
          prerelease: true
          make_latest: false
          name: SuperHealth iOS ${{ github.ref_name }} (expérimental)
          body: |
            Installation : guide « Installer sur iPhone » du README de la branche ios
            (https://github.com/MamaLama0/SuperHealth/tree/ios#installer-sur-iphone).
            - SideStore-HealthKit.ipa : à installer d'abord, avec iloader (Import IPA), depuis l'ordinateur.
            - SuperHealth.ipa : à installer ensuite depuis SideStore (My Apps > +), sur l'iPhone.
            - SuperHealth-simulator.zip : pour le simulateur iOS sur Mac.
          files: |
            SuperHealth.ipa
            SideStore-HealthKit.ipa
            SuperHealth-simulator.zip
