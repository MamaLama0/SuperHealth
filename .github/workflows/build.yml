name: Build SuperHealth

on:
  push:
    branches: [superhealth]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (SuperHealth)
        run: ./gradlew :app:testSuperhealthDebugUnitTest --tests 'app.superhealth.*' --stacktrace

      - name: Build optimized APK
        run: ./gradlew :app:assembleSuperhealthPerf --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SuperHealth-${{ github.sha }}
          path: app/build/outputs/apk/superhealth/perf/*.apk
          retention-days: 14
