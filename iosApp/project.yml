name: SuperHealth
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.7.5"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
targets:
  SuperHealth:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SuperHealth
      # assets de l'app Android (images d'exercices, aliments, bases JSON, police), copiés tels quels
      - path: ../assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.superhealth
        PRODUCT_NAME: SuperHealth
        INFOPLIST_FILE: SuperHealth/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperHealth/SuperHealth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lz -lsqlite3 -lc++"
    preBuildScripts:
      - name: Compile Kotlin (shared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - sdk: HealthKit.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: PhotosUI.framework
      - sdk: UserNotifications.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Metal.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
schemes:
  SuperHealth:
    build:
      targets:
        SuperHealth: all
    run:
      config: Debug
    archive:
      config: Release
