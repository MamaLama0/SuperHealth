name: SuperHealth
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.2"
    CURRENT_PROJECT_VERSION: "18"
    SWIFT_VERSION: "5.0"
targets:
  SuperHealth:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: SuperHealth
      - path: Common
      # assets de l'app Android (images d'exercices, aliments, bases JSON, police), copiés tels quels
      - path: ../assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.superhealth
        PRODUCT_NAME: SuperHealth
        INFOPLIST_FILE: SuperHealth/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperHealth/SuperHealth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # cœur dans chaque couleur d'accent (UIApplication.setAlternateIconName)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Green AppIcon-Yellow AppIcon-Purple AppIcon-Orange AppIcon-Gray"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lz -lsqlite3 -lc++"
    preBuildScripts:
      - name: Compile Kotlin (shared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: SuperHealthWidgets
        embed: true
      - sdk: HealthKit.framework
      - sdk: BackgroundTasks.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: PhotosUI.framework
      - sdk: UserNotifications.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Metal.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
  SuperHealthWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Widgets
      - path: Common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.superhealth.widgets
        PRODUCT_NAME: SuperHealthWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
schemes:
  SuperHealth:
    build:
      targets:
        SuperHealth: all
    run:
      config: Debug
    archive:
      config: Release
