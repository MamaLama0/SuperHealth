final def getVersionCode = { ->
    try {
        final def commitCount = providers.exec {
            commandLine('git', 'rev-list', 'HEAD', '--count')
        }.standardOutput.asText.get().trim()
        return Integer.valueOf(commitCount)
    } catch (ignored) {
        return null
    }
}

tasks.register("buildGitChangelog"){
    final def changelogFile = new File("${project.rootDir}/app/build/generated/res/changelog/xml/changelog_git.xml")

    def gitFile = project.rootProject.file('.git')
    def gitHead = null

    if (gitFile.directory) {
        gitHead = new File(gitFile, 'HEAD')
    } else if (gitFile.file) {
        def gitDir = gitFile.text.trim().replaceFirst(/^gitdir:\s*/, '')
        gitHead = new File(gitDir).with {
            isAbsolute() ? new File(it, 'HEAD') : new File(gitFile.parentFile, it.path + '/HEAD')
        }
    }

    inputs.file(gitHead)
    outputs.file(changelogFile)

    doLast {
        def allCommits
        try {
            allCommits = providers.exec {
                commandLine('git', 'log', '--pretty=format:%H %s')
            }.standardOutput.asText.get()
        } catch (ignored) {
            logger.warn("Skipping git changelog: git is not available")
            changelogFile.getParentFile().mkdirs()
            changelogFile.write(groovy.xml.XmlUtil.serialize(new Node(null, 'changelog')))
            return
        }

        def commitVersionCode = getVersionCode()
        def includedCommits = 0
        def includedTranslations = 0
        final def changelogNode = new Node(null, 'changelog')

        allCommits.trim().eachLine { final line ->
            if (includedCommits > 100) {
                return true
            }

            final def (fullCommitHash, commitMessage) = line.split(" ", 2)
            final def commitHash = fullCommitHash.take(10)
            if (commitMessage.contains("Translated using Weblate")) {
                if (includedTranslations == 0) {
                    final def releaseNode = new Node(changelogNode, 'release', [version: commitHash, versioncode: commitVersionCode--])
                    def _ = new Node(releaseNode, 'change', [:], "Sync translations from Weblate")
                }
                includedTranslations++
                return true
            }

            final def releaseNode = new Node(changelogNode, 'release', [version: commitHash, versioncode: commitVersionCode--])
            def _ = new Node(releaseNode, 'change', [:], commitMessage)
            includedCommits++
        }

        changelogFile.getParentFile().mkdirs()
        changelogFile.write(groovy.xml.XmlUtil.serialize(changelogNode))
    }
}

final def getGitHashShort = { ->
    try {
        return providers.exec {
            commandLine('git', 'rev-parse', 'HEAD')
        }.standardOutput.asText.get().trim().take(10)
    } catch (ignored) {
        return null
    }
}

final def getGitDirtyFlag = { ->
    try {
        return providers.exec {
            commandLine('git', 'status', '--porcelain')
        }.standardOutput.asText.get().trim().isBlank() ? "" : " (dirty)"
    } catch (ignored) {
        return " (unknown status)"
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    namespace = 'nodomain.freeyourgadget.gadgetbridge'
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId "nodomain.freeyourgadget.gadgetbridge"

        // Note: update toolchain.languageVersion when changing targetSdk
        //noinspection OldTargetApi
        targetSdk = 35
        // Note: update sourceCompatibility and targetCompatibility when changing minSdk
        minSdk = 23

        // Note: always bump BOTH versionCode and versionName!
        versionName "0.95.1"
        versionCode 255
        vectorDrawables.useSupportLibrary = true
        buildConfigField "String", "GIT_HASH_SHORT", "\"${getGitHashShort()}\""
        buildConfigField "String", "GIT_DIRTY_STATUS", "\"${getGitDirtyFlag()}\""
        buildConfigField "boolean", "INTERNET_ACCESS", "false"

        manifestPlaceholders = [
            appAuthRedirectScheme: "${applicationId}"
        ]
    }

    signingConfigs {
        nightly {
            if (System.getProperty("nightly_store_file") != null) {
                storeFile file(System.getProperty("nightly_store_file"))
                storePassword System.getProperty("nightly_store_password")
                keyAlias System.getProperty("nightly_key_alias")
                keyPassword System.getProperty("nightly_key_password")
            }
        }
    }

    flavorDimensions += "device_type"
    productFlavors {
        mainline {
            // Ensure that when starting from scratch, 'mainline' is selected, not 'banglejs'
            getIsDefault().set(true)
            // the default build product flavor
            dimension "device_type"
            //applicationIdSuffix ""
            //versionNameSuffix ""
        }

        localhealth {
            // LocalHealth: Google Health–style UI on top of the Gadgetbridge engine, no network
            dimension "device_type"
            applicationId "app.localhealth"
            versionNameSuffix "-localhealth"
        }

        superhealth {
            // SuperHealth: La Bouffe (nutrition) + La Salle (musculation) + LocalHealth (montres), interface MacroFactor
            dimension "device_type"
            applicationId "app.superhealth"
            versionName "1.5"
            versionCode 7
            // Navigation Compose, Room et Health Connect côté nutrition/musculation : Android 8.0 minimum (comme La Bouffe et La Salle)
            minSdk = 26
            // Interface en français et en anglais seulement : les ~70 langues de Gadgetbridge sont retirées (resources.arsc).
            resourceConfigurations += ["en", "fr"]
            // Téléphones ARM uniquement (pas d'émulateur x86).
            ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        }

        banglejs {
            dimension "device_type"
            applicationId "com.espruino.gadgetbridge"
            applicationIdSuffix ".banglejs"
            versionNameSuffix "-banglejs"
            buildConfigField "boolean", "INTERNET_ACCESS", "true"
            // Note: app/src/banglejs/AndroidManifest.xml contains some extra permissions
        }
    }

    sourceSets {
        main {
            java.srcDirs += "build/generated/sources/gbdao"
            java.srcDirs += "build/generated/sources/fit"
            kotlin.srcDirs += "build/generated/sources/kaitaiaux"
            res.srcDirs += "build/generated/res/changelog"
        }
        test {
            // The optional FIT round-trip corpus (FitExporterReadmeRoundTripTest) is read
            // by filesystem path, not the classpath, and is not committed. Exclude it from
            // the test resources so Gradle does not copy tens of thousands of files into
            // the unit-test runtime on every build.
            resources {
                exclude "FIT-test-files-main/**"
            }
        }
    }

    buildTypes {
        //debug {
        //    minifyEnabled true
        //    proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        //}

        // SuperHealth au quotidien : même identifiant et même clé que le build debug (mise à jour sans perte de données),
        // mais non débogable pour qu'Android compile et optimise le code (Compose 2 à 3 fois plus fluide).
        perf {
            initWith debug
            debuggable false
            profileable true
            // R8 : code inutilisé retiré et optimisé (règles de Gadgetbridge + proguard-superhealth.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro", "proguard-superhealth.pro"
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['debug']
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        nightly {
            applicationIdSuffix ".nightly"
            versionNameSuffix "-${getGitHashShort}"
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            minifyEnabled true
            debuggable false

            if (System.getProperty("nightly_store_file") != null) {
                signingConfig = signingConfigs.nightly
            } else {
                signingConfig = signingConfigs.debug
            }
        }

        nopebble {
            applicationIdSuffix ".nightly_nopebble"
            versionNameSuffix "-${getGitHashShort}"
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            minifyEnabled true
            debuggable false

            if (System.getProperty("nightly_store_file") != null) {
                signingConfig = signingConfigs.nightly
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    lint {
        abortOnError = true
        lintConfig = file("${rootDir}/app/src/main/lint.xml")
        // If true, generate an HTML report (with issue explanations, sourcecode, etc)
        htmlReport = true
        // Optional path to report (default will be lint-results.html in the builddir)
        htmlOutput = layout.buildDirectory.file("reports/lint/lint.html").get().asFile
        // Ignore checks present in the snapshot
        baseline = file("lint-baseline.xml")
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
        viewBinding = true
        compose = true
        // AGP 9 defaults to false, but we still use it in the androidComponents.onVariants block below
        resValues = true
    }
    packagingOptions {
        // Unable to strip the following libraries, packaging them as they are.
        // https://issuetracker.google.com/issues/353554169
        jniLibs.keepDebugSymbols.add("**/libimage_processing_util_jni.so")
        jniLibs.keepDebugSymbols.add("**/libsurface_util_jni.so")
        jniLibs.keepDebugSymbols.add("**/libandroidx.graphics.path.so")
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
            variant.makeResValueKey("string", "applicationId"),
            variant.applicationId.map { new ResValue(it, null) }
        )

        if (variant.buildType == "nightly" || variant.buildType == "nopebble") {
            variant.outputs.each { output ->
                // nightly/nopebble builds get a monotonically increasing versionCode
                // based on the commit count, instead of the static defaultConfig one.
                output.versionCode.set(getVersionCode())
                output.outputFileName.set(
                    variant.applicationId.zip(output.versionName) { appId, versionName ->
                        "${appId}_${versionName}.apk"
                    }
                )
            }
        }
    }
}

