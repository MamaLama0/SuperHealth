# TrueNAS Apps -> Install via YAML. Build the local image first; see README.
# Replace both /mnt/POOL/apps/superhealth paths with your dataset paths.
services:
  friend-relay:
    image: superhealth-friend-relay:2
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "568:568"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.50
    ulimits:
      nofile:
        soft: 256
        hard: 256
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      FEEDBACK_GITHUB_REPO: "${FEEDBACK_GITHUB_REPO:-}"
      FEEDBACK_GITHUB_TOKEN: "${FEEDBACK_GITHUB_TOKEN:-}"
      MEDIA_QUOTA_BYTES: "${MEDIA_QUOTA_BYTES:-100000000000}"
      SOCIAL_RETENTION_DAYS: "${SOCIAL_RETENTION_DAYS:-1830}"
      MAX_SOCIAL_ENTRIES: "${MAX_SOCIAL_ENTRIES:-200000}"
      MAX_MEDIA_PER_MAILBOX: "${MAX_MEDIA_PER_MAILBOX:-20000}"
      MAX_NEW_MAILBOXES_PER_HOUR: "${MAX_NEW_MAILBOXES_PER_HOUR:-12}"
      MAX_MEDIA_FILES: "${MAX_MEDIA_FILES:-100000}"
      PUBLISH_KEY_FILE: /run/secrets/publish_key
      MAX_CARDS: "500"
      RATE_LIMIT_PER_MINUTE: "240"
      MAX_IN_FLIGHT: "8"
    secrets: [publish_key]
    volumes:
      - /mnt/POOL/apps/superhealth/data:/data
    ports:
      - "127.0.0.1:8787:8787"
    networks: [relay]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
networks:
  relay:
    name: superhealth-relay
secrets:
  publish_key:
    file: /mnt/POOL/apps/superhealth/secrets/publish_key
